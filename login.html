<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login • Aidube</title>
  <script type="module">
    import { inject } from 'https://cdn.jsdelivr.net/npm/@vercel/analytics/+esm';
    inject();
  </script>
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="css/toast.css">
  <script>
    // Global callbacks for reCAPTCHA
    window.loginToken = null;
    window.signupToken = null;
    window.onLoginCaptcha = function (token) {
      window.loginToken = token;
    };
    window.onSignupCaptcha = function (token) {
      window.signupToken = token;
    };
  </script>
  <script src="https://www.google.com/recaptcha/enterprise.js" async defer></script>
</head>

<body>
  <header>
    <div class="header-content">
      <i class="fa-solid fa-chalkboard-user"></i>
      <span>Aidube</span>
    </div>
  </header>

  <div class="main-container">
    <div class="login-card">
      <div id="loginForm">
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to continue to Aidube</p>

        <div id="loginError" class="error-message"></div>

        <button id="googleLoginBtn" class="btn btn-google">
          <i class="fab fa-google" style="color: #4285F4;"></i> Continue with Google
        </button>

        <div class="divider">or</div>

        <form id="emailLoginForm">
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" class="form-input" placeholder="name@example.com" required />
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required
              style="position: relative; z-index: 10;" />
          </div>
          <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
            <input type="checkbox" id="showLoginPassword" style="width: auto; margin: 0;" />
            <label for="showLoginPassword" style="margin: 0; font-weight: 400; cursor: pointer; font-size: 0.9rem;">Show
              Password</label>
          </div>
          <div id="recaptcha-login" class="g-recaptcha" data-sitekey="6LcL004sAAAAALsn74XuPBG2bSC19YId79_PT6rB"
            data-action="LOGIN" data-callback="onLoginCaptcha"
            style="margin-bottom: 1rem; display: flex; justify-content: center;"></div>
          <button type="submit" class="btn btn-primary">
            Sign In <i class="fas fa-arrow-right"></i>
          </button>
        </form>

        <div class="toggle-text">
          Don't have an account? <span id="showSignup" class="toggle-link">Sign up</span>
        </div>
      </div>

      <div id="signupForm" class="hidden">
        <h1>Create Account</h1>
        <p class="subtitle">Join Aidube today</p>

        <div id="signupError" class="error-message"></div>

        <button id="googleSignupBtn" class="btn btn-google">
          <i class="fab fa-youtube" style="color: #ff0000;"></i> Continue with Google
        </button>

        <div class="divider">or</div>

        <form id="emailSignupForm">
          <div class="form-group">
            <label for="signupUsername">Username</label>
            <input type="text" id="signupUsername" class="form-input" placeholder="Your Name" required />
          </div>
          <div class="form-group">
            <label for="signupEmail">Email Address</label>
            <input type="email" id="signupEmail" class="form-input" placeholder="name@example.com" required />
          </div>
          <div class="form-group">
            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" class="form-input" placeholder="Create a password" required
              style="position: relative; z-index: 10;" />
          </div>
          <div class="form-group">
            <label for="signupConfirmPassword">Confirm Password</label>
            <input type="password" id="signupConfirmPassword" class="form-input" placeholder="Confirm your password"
              required style="position: relative; z-index: 10;" />
          </div>
          <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
            <input type="checkbox" id="showSignupPassword" style="width: auto; margin: 0;" />
            <label for="showSignupPassword"
              style="margin: 0; font-weight: 400; cursor: pointer; font-size: 0.9rem;">Show Password</label>
          </div>
          <div id="recaptcha-signup" class="g-recaptcha" data-sitekey="6LcL004sAAAAALsn74XuPBG2bSC19YId79_PT6rB"
            data-action="SIGNUP" data-callback="onSignupCaptcha"
            style="margin-bottom: 1rem; display: flex; justify-content: center;"></div>
          <button type="submit" class="btn btn-primary">
            Create Account <i class="fas fa-user-plus"></i>
          </button>
        </form>

        <div class="toggle-text">
          Already have an account? <span id="showLogin" class="toggle-link">Sign in</span>
        </div>
      </div>
    </div>
  </div>

  <footer style="text-align: center; padding: 1rem 0; color: #fff; opacity: 0.8; width: 100%; margin-top: auto;">
    <p style="font-size: 0.8rem;">&copy; 2026 Aidube | <a href="privacy_policy.html"
        style="color: #fff; text-decoration: underline;">Privacy Policy</a></p>
  </footer>

  <script type="module">
    // Global error handler
    window.onerror = function (msg, url, lineNo, columnNo, error) {
      // Error logged
      return false;
    };

    import { auth, googleProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, updateProfile } from "./js/firebase.js";
    import { showNotification } from "./js/utils.js";

    // Login script loaded

    try {
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const showSignupBtn = document.getElementById('showSignup');
      const showLoginBtn = document.getElementById('showLogin');
      const loginError = document.getElementById('loginError');
      const signupError = document.getElementById('signupError');

      if (!showSignupBtn || !showLoginBtn) {
        // Toggle buttons not found
      }

      // Toggle Forms
      showSignupBtn.addEventListener('click', () => {
        // Switching to Signup form
        loginForm.classList.add('hidden');
        signupForm.classList.remove('hidden');
        signupForm.classList.add('fade-in');
        loginError.style.display = 'none';
      });

      showLoginBtn.addEventListener('click', () => {
        // Switching to Login form
        signupForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
        loginForm.classList.add('fade-in');
        signupError.style.display = 'none';
      });

      // Show/Hide Password Logic
      const togglePasswordVisibility = (checkboxId, ...inputIds) => {
        const checkbox = document.getElementById(checkboxId);
        const inputs = inputIds.map(id => document.getElementById(id));

        if (checkbox && inputs.length > 0) {
          checkbox.addEventListener('change', () => {
            const type = checkbox.checked ? 'text' : 'password';
            inputs.forEach(input => {
              if (input) input.type = type;
            });
          });
        }
      };

      togglePasswordVisibility('showLoginPassword', 'loginPassword');
      togglePasswordVisibility('showSignupPassword', 'signupPassword', 'signupConfirmPassword');


      // Google Login
      const handleGoogleLogin = async () => {
        // Starting Google Login...
        try {
          await signInWithPopup(auth, googleProvider);
          // Google Login success
          window.location.href = "index.html";
        } catch (error) {
          // Google Login Error
          showNotification("Google Login Failed: " + error.message, "error");
        }
      };

      const googleLoginBtn = document.getElementById('googleLoginBtn');
      const googleSignupBtn = document.getElementById('googleSignupBtn');

      if (googleLoginBtn) googleLoginBtn.addEventListener('click', handleGoogleLogin);
      if (googleSignupBtn) googleSignupBtn.addEventListener('click', handleGoogleLogin);

      // Email Login
      const emailLoginForm = document.getElementById('emailLoginForm');
      if (emailLoginForm) {
        emailLoginForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          // Attempting Email Login...
          const email = document.getElementById('loginEmail').value;
          const password = document.getElementById('loginPassword').value;

          try {
            // Verify Recaptcha
            const token = window.loginToken;
            if (!token) {
              throw new Error("Please complete the CAPTCHA");
            }

            // Optional: Verify with backend
            const verifyRes = await fetch('/verify-recaptcha', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token, action: 'LOGIN' })
            });
            const verifyData = await verifyRes.json();
            if (!verifyData.success) {
              throw new Error("CAPTCHA verification failed");
            }

            await signInWithEmailAndPassword(auth, email, password);
            // Email Login success
            window.location.href = "index.html";
          } catch (error) {
            // Email Login Error
            loginError.textContent = "Error: " + error.message;
            loginError.style.display = 'block';
            if (window.grecaptcha && window.grecaptcha.enterprise) grecaptcha.enterprise.reset();
          }
        });
      }

      // Email Signup
      const emailSignupForm = document.getElementById('emailSignupForm');
      if (emailSignupForm) {
        emailSignupForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          // Attempting Email Signup...
          const username = document.getElementById('signupUsername').value;
          const email = document.getElementById('signupEmail').value;
          const password = document.getElementById('signupPassword').value;
          const confirmPassword = document.getElementById('signupConfirmPassword').value;

          if (password !== confirmPassword) {
            signupError.textContent = "Passwords do not match!";
            signupError.style.display = 'block';
            return;
          }

          try {
            // Verify Recaptcha
            const token = window.signupToken;
            if (!token) {
              throw new Error("Please complete the CAPTCHA");
            }

            // Optional: Verify with backend
            const verifyRes = await fetch('/verify-recaptcha', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token, action: 'SIGNUP' })
            });
            const verifyData = await verifyRes.json();
            if (!verifyData.success) {
              throw new Error("CAPTCHA verification failed");
            }

            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            // Email Signup success

            if (username) {
              await updateProfile(userCredential.user, {
                displayName: username
              });
              // Profile updated
            }

            window.location.href = "index.html";
          } catch (error) {
            // Email Signup Error
            signupError.textContent = "Error: " + error.message;
            signupError.style.display = 'block';
            if (window.grecaptcha && window.grecaptcha.enterprise) grecaptcha.enterprise.reset();
          }
        });
      }

      // Auth State Listener
      onAuthStateChanged(auth, (user) => {
        if (user) {
          // User already logged in
          window.location.href = "index.html";
        } else {
          // No user logged in
        }
      });

    } catch (err) {
      // Critical error in login script
      showNotification("Something went wrong initializing the login page. Check console for details.", "error");
    }
  </script>
</body>

</html>
