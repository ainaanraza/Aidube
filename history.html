<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecture History</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    .history-container {
      max-width: 900px;
      margin: 2rem auto;
      background: white;
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 4px 8px rgba(59, 130, 246, 0.15);
      border: 1px solid #dbeafe;
    }
    header {
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      color: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 4px rgba(59,130,246,0.15);
    }
    header a {
      color: white;
      text-decoration: none;
      font-size: 0.9rem;
      background: rgba(255,255,255,0.2);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      transition: 0.2s;
    }
    header a:hover {
      background: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <header>
    <h1><i class="fas fa-clock"></i> History</h1>
    <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Main Page</a>
  </header>

  <main class="history-container">
    <div id="lectureHistory"></div>
    <button class="clear-button" onclick="clearAllLectureHistory()">
      <i class="fas fa-trash"></i> Clear All History
    </button>
  </main>

  <script src="js/index.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
    updateLectureHistory();
  });
  </script>

</body>
</html>
