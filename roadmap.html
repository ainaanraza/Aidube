<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Journey</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/roadmap.css">
  <!-- removed embedded styles - moved into css/roadmap.css -->
</head>
<body>
  <h1 class="roadmap-title">Your Learning Journey: <span id="topicTitle"></span></h1>
  
  <div class="roadmap-container">
    <!-- === FILTER SECTION START === -->
    <div class="filter-card compact">
      <h3 class="filter-title">Customize</h3>

      <div class="filter-row">
        <div class="filter-group">
          <label for="levelSelect">Level</label>
          <select id="levelSelect">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="knowledgeSelect">Knowledge</label>
          <select id="knowledgeSelect">
            <option value="new">New</option>
            <option value="previous">Known</option>
          </select>
        </div>
      </div>

      <div id="topicsContainer">
        <label><strong>Known topics</strong></label>
        <div id="dynamicTopics" class="topics-grid"></div>
      </div>

      <button id="generateBtn" class="generate-btn">Generate</button>
    </div>
    <!-- === FILTER SECTION END === -->

    <div id="roadmapContent">
      <!-- unified content area (mobile UI removed) -->
      <div class="loading">Create your personalized learning path</div>
    </div>
  </div>

  <script type="module" src="js/roadmap.js"></script>
</body>
</html>
