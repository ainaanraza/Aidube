<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Journey</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #45a049;
      --primary-dark: #378039;
      --primary-light: #6bbd6e;
      --background: #ffffff;
      --card: #ffffff;
      --text: #2c3e50;
      --text-light: #666666;
      --border: #e0e0e0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--background);
      background-image: 
        linear-gradient(45deg, rgba(69, 160, 73, 0.05) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(69, 160, 73, 0.05) 25%, transparent 25%);
      background-size: 60px 60px;
      min-height: 100vh;
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    .roadmap-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem;
      position: relative;
    }

    .roadmap-title {
      text-align: center;
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 4rem;
      position: relative;
      color: var(--primary);
    }

    .roadmap-title::after {
      content: "";
      position: absolute;
      bottom: -1rem;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 4px;
      background: var(--primary);
      border-radius: 2px;
    }

    .roadmap-tree {
      position: relative;
      padding: 2rem 0;
    }

    .roadmap-tree::before {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 100%;
      background: var(--primary);
      opacity: 0.3;
    }

    .roadmap-step {
      position: relative;
      margin: 4rem 0;
      width: calc(50% - 2rem);
      padding: 2rem;
      background: var(--card);
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(69, 160, 73, 0.1);
      animation: fadeIn 0.5s ease-out forwards;
      opacity: 0;
      border: 2px solid var(--primary);
    }

    .roadmap-step:nth-child(odd) {
      margin-left: auto;
      transform-origin: left center;
    }

    .roadmap-step:nth-child(even) {
      margin-right: auto;
      transform-origin: right center;
    }

    .roadmap-step::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: var(--primary);
      border-radius: 50%;
      top: 50%;
      transform: translateY(-50%);
      box-shadow: 0 0 0 4px rgba(69, 160, 73, 0.2);
    }

    .roadmap-step:nth-child(odd)::before {
      left: -3rem;
    }

    .roadmap-step:nth-child(even)::before {
      right: -3rem;
    }

    .roadmap-step::after {
      content: "";
      position: absolute;
      width: 2rem;
      height: 2px;
      background: var(--primary);
      top: 50%;
      transform: translateY(-50%);
    }

    .roadmap-step:nth-child(odd)::after {
      left: -2rem;
    }

    .roadmap-step:nth-child(even)::after {
      right: -2rem;
    }

    .roadmap-step p {
      font-size: 1.1rem;
      color: var(--text);
      margin-bottom: 1.5rem;
    }

    .roadmap-step a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--primary);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .roadmap-step a::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transform: translateX(-100%);
      transition: 0.5s;
    }

    .roadmap-step a:hover::before {
      transform: translateX(100%);
    }

    .roadmap-step a:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(69, 160, 73, 0.3);
    }

    .save-roadmap-button {
      display: block;
      margin: 3rem auto 0;
      padding: 1rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .save-roadmap-button:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(69, 160, 73, 0.3);
    }

    .save-roadmap-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transform: translateX(-100%);
      transition: 0.5s;
    }

    .save-roadmap-button:hover::before {
      transform: translateX(100%);
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
      font-size: 1.2rem;
      color: var(--text-light);
      gap: 0.5rem;
    }

    .loading::after {
      content: "";
      width: 20px;
      height: 20px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--primary);
      color: white;
      padding: 1rem 2rem;
      border-radius: 0.5rem;
      box-shadow: 0 5px 15px rgba(69, 160, 73, 0.3);
      transform: translateY(100px);
      animation: slideUp 0.3s forwards;
    }

    @keyframes slideUp {
      to { transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .roadmap-tree::before {
        left: 1rem;
      }

      .roadmap-step {
        width: calc(100% - 3rem);
        margin-left: 3rem !important;
      }

      .roadmap-step::before {
        left: -2rem !important;
      }

      .roadmap-step::after {
        left: -1rem !important;
        width: 1rem !important;
      }

      .roadmap-title {
        font-size: 2rem;
      }
    }
  </style>
  <script type="module">
  import { GoogleGenerativeAI } from "https://cdn.jsdelivr.net/npm/@google/generative-ai/+esm";

  const API_KEY = "AIzaSyAXh5mE52qyJuIyv8QjMpx6CRWQb363wZ0";

  // small helper to query single element
  const $ = (sel) => document.querySelector(sel);

  // Wait for DOM to be ready, then wire event listeners
  document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const topic = params.get("topic");
    const topicTitleEl = $("#topicTitle");
    if (topicTitleEl) topicTitleEl.textContent = topic || "Unknown Topic";

    // Toggle the "previously known" topics container
    const knowledgeSelect = $("#knowledgeSelect");
    const topicsContainer = $("#topicsContainer");
    if (knowledgeSelect && topicsContainer) {
      knowledgeSelect.addEventListener("change", (e) => {
        topicsContainer.style.display = e.target.value === "previous" ? "block" : "none";
      });
    }

    // Attach click listener to Generate button
    const generateBtn = $("#generateBtn");
    if (generateBtn) {
      generateBtn.addEventListener("click", async () => {
        if (!topic) {
          alert("Please provide a topic in the URL (?topic=YourTopic)");
          return;
        }
        await generateRoadmap(topic);
      });
    }
  });

  // Main function that generates roadmap using filters
  async function generateRoadmap(topic) {
    const roadmapContainer = document.getElementById("roadmapContent");
    try {
      // Show loading UI
      roadmapContainer.innerHTML = `<div class="loading">Generating roadmap — please wait...</div>`;

      // Read filter values (safe guards if elements missing)
      const levelEl = document.getElementById("levelSelect");
      const knowledgeEl = document.getElementById("knowledgeSelect");
      const level = levelEl ? levelEl.value : "beginner";
      const knowledge = knowledgeEl ? knowledgeEl.value : "new";

      // If previously known -> collect excluded topics
      let excludedTopics = [];
      if (knowledge === "previous") {
        excludedTopics = Array.from(document.querySelectorAll("#topicsContainer input[type='checkbox']:checked"))
          .map(cb => cb.value);
      }

      // Build prompt that includes level + exclusions
      let prompt = `Create a ${level} level learning roadmap for: ${topic}.`;
      if (knowledge === "previous" && excludedTopics.length > 0) {
        prompt += ` Exclude these topics: ${excludedTopics.join(", ")}.`;
      }
      prompt += " Provide the roadmap as short ordered/bullet steps, each on a new line.";

      // Call the generative model
      const genAI = new GoogleGenerativeAI(API_KEY);
      const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
      const result = await model.generateContent(prompt);
      const response = await result.response.text();

      // result.response.text() can be async — await it when available
      const responseText = (result && result.response && typeof result.response.text === "function")
        ? await result.response.text()
        : (result && result.response) ? String(result.response) : "";

      roadmapContainer.innerHTML = ""; // clear loading

      if (!responseText || responseText.trim() === "") {
        roadmapContainer.innerHTML = `<div class="error-message">Unable to generate roadmap. Please check your API key and network.</div>`;
        return;
      }

      // Parse into steps (strip leading bullets/numbers and empty lines)
      const steps = responseText
        .split(/\r?\n/)
        .map(s => s.replace(/^[\s\-\*\d\.\)]+/, "").trim())
        .filter(s => s !== "");

      // Build DOM
      const roadmapTree = document.createElement("div");
      roadmapTree.className = "roadmap-tree";

      steps.forEach((step, index) => {
        const isMainTopic = !step.startsWith("-");
        const mainTopic = step.split(":")[0].trim();

        const roadmapStep = document.createElement("div");
        roadmapStep.className = "roadmap-step";
        roadmapStep.style.animationDelay = `${index * 0.12}s`;
        roadmapStep.innerHTML = `
          <p>${step}</p>
          ${isMainTopic ? `<a href="index.html?search=${encodeURIComponent(mainTopic)}">
            Explore Playlist
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </a>` : ""}
        `;
        roadmapTree.appendChild(roadmapStep);
      });

      roadmapContainer.appendChild(roadmapTree);

      // Add Save button (uses saveRoadmap below)
      const saveButton = document.createElement("button");
      saveButton.className = "save-roadmap-button";
      saveButton.innerHTML = `
        Save Your Journey
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left:8px">
          <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
      `;
      saveButton.onclick = () => saveRoadmap(topic, steps);
      roadmapContainer.appendChild(saveButton);

    } catch (err) {
      console.error("generateRoadmap error:", err);
      roadmapContainer.innerHTML = `<div class="error-message">Error generating roadmap. Open browser console for details.</div>`;
    }
  }

  // Save function (unchanged behavior)
  function saveRoadmap(topic, steps) {
    const savedRoadmaps = JSON.parse(localStorage.getItem("savedRoadmaps") || "[]");
    savedRoadmaps.push({ topic, steps });
    localStorage.setItem("savedRoadmaps", JSON.stringify(savedRoadmaps));

    const notification = document.createElement("div");
    notification.className = "notification";
    notification.textContent = "Journey saved successfully!";
    document.body.appendChild(notification);

    setTimeout(() => {
      notification.style.opacity = "0";
      notification.style.transform = "translateY(100px)";
      setTimeout(() => notification.remove(), 300);
    }, 3000);
  }
</script>

</head>
<body>
  <div class="roadmap-container">
  <h1 class="roadmap-title">Your Learning Journey: <span id="topicTitle"></span></h1>

  <!-- === FILTER SECTION START === -->
  <div id="filters" style="margin-bottom:2rem; padding:1rem; border:1px solid var(--border); border-radius:0.5rem;">
    <label><strong>Level:</strong></label>
    <select id="levelSelect">
      <option value="beginner">Beginner</option>
      <option value="intermediate">Intermediate</option>
      <option value="advanced">Advanced</option>
    </select>

    <br><br>

    <label><strong>Knowledge:</strong></label>
    <select id="knowledgeSelect">
      <option value="new">Completely New</option>
      <option value="previous">Previously Known</option>
    </select>

    <br><br>

    <div id="topicsContainer" style="display:none;">
      <label><strong>Select Known Topics (exclude from roadmap):</strong></label><br>
      <input type="checkbox" value="HTML"> HTML
      <input type="checkbox" value="CSS"> CSS
      <input type="checkbox" value="JavaScript"> JavaScript
      <input type="checkbox" value="React"> React
      <input type="checkbox" value="Node.js"> Node.js
      <!--Add more topics as needed -->
    </div>

    <br>
    <button id="generateBtn" class="save-roadmap-button">Generate Roadmap</button>
  </div>
  <!-- === FILTER SECTION END === -->

  <div id="roadmapContent">
    <div class="loading">Creating your personalized learning path</div>
  </div>
</div>

</body>
</html>
