<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Journey</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/roadmap.css">
</head>
<body>
  <div class="roadmap-container">
    <h1 class="roadmap-title">Your Learning Journey: <span id="topicTitle"></span></h1>

   <!-- === FILTER SECTION START === -->
<div class="filter-card">
  <h2 class="filter-title">Customize Your Learning Path</h2>

  <div class="filter-group">
    <label for="levelSelect">Level</label>
    <select id="levelSelect">
      <option value="beginner">Beginner</option>
      <option value="intermediate">Intermediate</option>
      <option value="advanced">Advanced</option>
    </select>
  </div>

  <div class="filter-group">
    <label for="knowledgeSelect">Knowledge</label>
    <select id="knowledgeSelect">
      <option value="new">Completely New</option>
      <option value="previous">Previously Known</option>
    </select>
  </div>

  <div id="topicsContainer" style="display:none;">
    <label><strong>Select Known Topics (exclude from roadmap):</strong></label>
    <div id="dynamicTopics" class="topics-grid"></div>
  </div>

  <button id="generateBtn" class="generate-btn">Generate Roadmap</button>
</div>
<!-- === FILTER SECTION END === -->


    <div id="roadmapContent">
      <div class="loading">Create your personalized learning path</div>
    </div>
  </div>

  <script type="module" src="js/roadmap.js"></script>

</body>
</html>
