<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aidube | Learning Journey</title>
  <meta name="description"
    content="Plan your learning journey with Aidube. Generate personalized, AI-driven roadmaps to master any skill.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Aidube | Learning Journey">
  <meta property="og:description"
    content="Plan your learning journey with Aidube. Generate personalized, AI-driven roadmaps to master any skill.">
  <meta property="og:image" content="aidube_logo2.png">

  <!-- Favicon -->
  <link rel="icon" href="aidube_logo2.png" type="image/png">
  <script type="module">
    import { inject } from 'https://cdn.jsdelivr.net/npm/@vercel/analytics/+esm';
    inject();
  </script>
  <!-- Google AdSense Auto Ads -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1717533159502136"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/roadmap.css">
  <link rel="stylesheet" href="css/toast.css">
</head>

<body>
  <header>
    <div class="header-content">
      <h1><i class="fas fa-map-signs"></i> Journey Planner</h1>
      <a href="index.html" class="back-button">
        <i class="fas fa-arrow-left"></i>
        <span>Dashboard</span>
      </a>
    </div>
  </header>

  <div class="container">
    <div class="roadmap-header">
      <h2 id="topicTitle">Custom Roadmap</h2>
      <p>Personalize your learning path with AI-driven milestones</p>
    </div>

    <!-- Native Ad - Top -->
    <div class="ad-container-native" style="margin-bottom: 1.5rem; width: 100%; text-align: center;">
      <span style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 0.5rem;">Sponsored</span>
      <iframe class="native-ad-iframe" style="width: 100%; border: none; overflow: hidden; min-height: 100px; display: block;" scrolling="no" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation" srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta name='viewport' content='width=device-width,initial-scale=1.0'&gt;&lt;style&gt;body{margin:0;padding:0;overflow:hidden;background:transparent;}#container-c4e03b5b676eb8461b0bde8f49fa1583{width:100%;}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div id='container-c4e03b5b676eb8461b0bde8f49fa1583'&gt;&lt;/div&gt;&lt;script async='async' data-cfasync='false' src='https://pl28846167.effectivegatecpm.com/c4e03b5b676eb8461b0bde8f49fa1583/invoke.js'&gt;&lt;/script&gt;&lt;script&gt;const observer=new ResizeObserver(()=&gt;{window.parent.postMessage({type:'resize-ad',height:document.body.scrollHeight},'*');});observer.observe(document.body);setInterval(()=&gt;window.parent.postMessage({type:'resize-ad',height:document.body.scrollHeight},'*'), 1000);&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
    </div>

    <div class="roadmap-container">
      <div class="filter-card animate__animated animate__fadeIn">
        <div class="filter-row"
          style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">
          <div class="filter-group">
            <label style="display: block; font-weight: 700; margin-bottom: 0.5rem;">Target Level</label>
            <select id="levelSelect"
              style="width: 100%; padding: 0.75rem; border-radius: 12px; border: 1px solid var(--border); background: white; font-family: inherit;">
              <option value="beginner">Beginner</option>
              <option value="intermediate" selected>Intermediate</option>
              <option value="advanced">Advanced</option>
            </select>
          </div>

          <div class="filter-group">
            <label style="display: block; font-weight: 700; margin-bottom: 0.5rem;">Current Knowledge</label>
            <select id="knowledgeSelect"
              style="width: 100%; padding: 0.75rem; border-radius: 12px; border: 1px solid var(--border); background: white; font-family: inherit;">
              <option value="new">Starting Fresh</option>
              <option value="previous">Some Experience</option>
            </select>
          </div>
        </div>

        <div id="topicsContainer" style="margin-bottom: 2rem; display: none;">
          <label style="display: block; font-weight: 700; margin-bottom: 1rem;">Select areas you already know:</label>
          <div id="dynamicTopics" class="topics-grid" style="display: flex; flex-wrap: wrap; gap: 0.75rem;"></div>
        </div>

        <button id="generateBtn" class="btn-primary"
          style="width: 100%; height: 56px; font-size: 1.1rem; border-radius: 16px;">
          <i class="fas fa-wand-magic-sparkles"></i> Generate Personalized Journey
        </button>
      </div>

      <div id="roadmapContent" style="margin-top: 3rem;">
        <div class="loading"
          style="text-align: center; color: var(--text-muted); font-size: 1.1rem; padding: 4rem; background: var(--surface); border-radius: 24px; border: 1px dashed var(--primary-light);">
          <i class="fas fa-rocket fa-3x"
            style="margin-bottom: 1.5rem; color: var(--primary-light); display: block;"></i>
          Ready to chart your course? Adjust the filters and hit generate!
        </div>
      </div>
      </div>
      <!-- Native Ad - Bottom -->
      <div class="ad-container-native" style="margin-top: 2rem; width: 100%; text-align: center;">
        <span style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 0.5rem;">Sponsored</span>
        <iframe class="native-ad-iframe" style="width: 100%; border: none; overflow: hidden; min-height: 100px; display: block;" scrolling="no" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation" srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta name='viewport' content='width=device-width,initial-scale=1.0'&gt;&lt;style&gt;body{margin:0;padding:0;overflow:hidden;background:transparent;}#container-c4e03b5b676eb8461b0bde8f49fa1583{width:100%;}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div id='container-c4e03b5b676eb8461b0bde8f49fa1583'&gt;&lt;/div&gt;&lt;script async='async' data-cfasync='false' src='https://pl28846167.effectivegatecpm.com/c4e03b5b676eb8461b0bde8f49fa1583/invoke.js'&gt;&lt;/script&gt;&lt;script&gt;const observer=new ResizeObserver(()=&gt;{window.parent.postMessage({type:'resize-ad',height:document.body.scrollHeight},'*');});observer.observe(document.body);setInterval(()=&gt;window.parent.postMessage({type:'resize-ad',height:document.body.scrollHeight},'*'), 1000);&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
      </div>
    </div>
  </div>

  <script type="module" src="js/roadmap.js"></script>
  <script>
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'resize-ad') {
        document.querySelectorAll('.native-ad-iframe').forEach(iframe => {
          if (iframe.contentWindow === e.source) iframe.style.height = e.data.height + 'px';
        });
      }
    });
  </script>
</body>

</html>
