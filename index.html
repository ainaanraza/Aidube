<body>
  <header>
    <div class="header-content">
      <div class="left-section">
        <div class="logo-area" onclick="window.location.href='index.html'">
          <i class="fa-solid fa-chalkboard-user"></i>
          <span>Aidube</span>
        </div>
        <button class="btn-ghost" onclick="window.location.href='about.html'">
          <i class="fas fa-info-circle"></i> About
        </button>
      </div>
      <div class="nav-actions">
        <div id="userInfo" class="user-profile-header" onclick="openProfileDrawer()">
          <div class="user-avatar"><i class="fas fa-user-circle"></i></div>
          <div class="user-details">
            <p>Guest Explorer</p>
            <span>Sign in for full access</span>
          </div>
        </div>


      </div>
    </div>
  </header>

  <!-- Mobile Profile Drawer -->
  <div id="drawerOverlay" class="drawer-overlay" onclick="closeProfileDrawer()"></div>
  <div id="profileDrawer" class="profile-drawer">
    <div class="drawer-header">
      <button class="btn-ghost drawer-close-btn" onclick="closeProfileDrawer()">
        <i class="fas fa-times"></i>
      </button>
      <div id="drawerUserInfo" class="drawer-user-info">
        <!-- Injected via JS -->
      </div>
    </div>

    <div class="drawer-content">
      <div class="drawer-section" style="margin-bottom: 1.5rem;">
        <button class="btn-golden" style="width: 100%; justify-content: center;"
          onclick="window.location.href='analytics.html'">
          <i class="fas fa-chart-pie"></i> Analytics & Earnings
        </button>
      </div>
      <div class="drawer-section">
        <h3><i class="fas fa-list-ul"></i> Saved Playlists</h3>
        <div id="drawerSavedPlaylists" class="saved-list"></div>
        <button class="clear-button btn-ghost" onclick="clearAllSavedPlaylists()">
          <i class="fas fa-trash-alt"></i> Clear All
        </button>
      </div>

      <div class="drawer-section">
        <h3><i class="fas fa-map-marked-alt"></i> Saved Roadmaps</h3>
        <div id="drawerSavedRoadmaps" class="saved-list"></div>
        <button class="clear-button btn-ghost" onclick="clearAllRoadmaps()">
          <i class="fas fa-trash-alt"></i> Clear All
        </button>
      </div>
    </div>

    <div class="drawer-footer">
      <button id="drawerLogoutBtn" class="btn-secondary" style="width: 100%; justify-content: center;">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>
  </div>



  <div class="container">
    <aside class="sidebar">

      <button class="btn-golden" style="width: 100%; justify-content: center; margin-bottom: 1.5rem;"
        onclick="window.location.href='analytics.html'">
        <i class="fas fa-chart-pie"></i> Analytics & Earnings
      </button>

      <div class="sidebar-card">
        <h3><i class="fas fa-list-ul"></i> Saved Playlists</h3>
        <div id="savedPlaylists" class="saved-list"></div>
        <button class="clear-button btn-ghost" onclick="clearAllSavedPlaylists()">
          <i class="fas fa-trash-alt"></i> Clear All
        </button>
      </div>

      <div class="sidebar-card">
        <h3><i class="fas fa-map-marked-alt"></i> Saved Roadmaps</h3>
        <div id="savedRoadmaps" class="saved-list"></div>
        <button class="clear-button btn-ghost" onclick="clearAllRoadmaps()">
          <i class="fas fa-trash-alt"></i> Clear All
        </button>
      </div>

      <!-- Native Ad - Sidebar -->
      <div class="ad-container-native sidebar-ad"
        style="margin: 1.5rem 0; width: 100%; text-align: center; background: var(--surface); padding: 1rem; border-radius: var(--radius); border: 1px solid var(--border);">
        <span
          style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 0.5rem;">Sponsored</span>
        <iframe class="native-ad-iframe"
          style="width: 100%; border: none; overflow: hidden; min-height: 100px; display: block;" scrolling="no"
          sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"
          srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta name='viewport' content='width=device-width,initial-scale=1.0'&gt;&lt;style&gt;body{margin:0;padding:0;overflow:hidden;background:transparent;}#container-c4e03b5b676eb8461b0bde8f49fa1583{width:100%;}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div id='container-c4e03b5b676eb8461b0bde8f49fa1583'&gt;&lt;/div&gt;&lt;script async='async' data-cfasync='false' src='https://pl28846167.effectivegatecpm.com/c4e03b5b676eb8461b0bde8f49fa1583/invoke.js'&gt;&lt;/script&gt;&lt;script&gt;const observer=new ResizeObserver(()=&gt;{window.parent.postMessage({type:'resize-ad',height:document.body.scrollHeight},'*');});observer.observe(document.body);setInterval(()=&gt;window.parent.postMessage({type:'resize-ad',height:document.body.scrollHeight},'*'), 1000);&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
      </div>
    </aside>

    <main class="main-content">
      <div class="search-container">
        <div class="search-input-wrapper">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="What do you want to learn today?">
        </div>
        <button class="btn-primary" onclick="fetchPlaylists()">Search</button>
        <button class="btn-secondary" onclick="redirectToRoadmap()">
          <i class="fas fa-map"></i> Roadmap
        </button>
        <button class="btn-resource" onclick="redirectToResearch()">
          <i class="fas fa-book"></i> Resource
        </button>
        <button class="btn-ghost" onclick="window.location.href='history.html'">
          <i class="fas fa-history"></i> History
        </button>
      </div>

      <div id="lastPlayedContainer"></div>

      <!-- Native Ad - Top of Main -->
      <div id="topMainAd" class="ad-container-native" style="margin: 1.5rem 0; width: 100%; text-align: center;">
        <span
          style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 0.5rem;">Sponsored</span>
        <iframe class="native-ad-iframe"
          style="width: 100%; border: none; overflow: hidden; min-height: 100px; display: block;" scrolling="no"
          sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"
          srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta name='viewport' content='width=device-width,initial-scale=1.0'&gt;&lt;style&gt;body{margin:0;padding:0;overflow:hidden;background:transparent;}#container-c4e03b5b676eb8461b0bde8f49fa1583{width:100%;}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div id='container-c4e03b5b676eb8461b0bde8f49fa1583'&gt;&lt;/div&gt;&lt;script async='async' data-cfasync='false' src='https://pl28846167.effectivegatecpm.com/c4e03b5b676eb8461b0bde8f49fa1583/invoke.js'&gt;&lt;/script&gt;&lt;script&gt;const observer=new ResizeObserver(()=&gt;{window.parent.postMessage({type:'resize-ad',height:document.body.scrollHeight},'*');});observer.observe(document.body);setInterval(()=&gt;window.parent.postMessage({type:'resize-ad',height:document.body.scrollHeight},'*'), 1000);&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
      </div>

      <div class="playlists-header"
        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 id="playlistsHeaderText" style="font-size: 1.5rem; font-weight: 800; color: var(--text);">Recommended for You</h2>
      </div>

      <div class="playlists" id="playlistContainer">
        <!-- Playlists will be injected here -->
      </div>

      <!-- Native Ad - Bottom of Main -->
      <div class="ad-container-native mobile-only-ad" style="margin: 2rem 0; width: 100%; text-align: center;">
        <span
          style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 0.5rem;">Sponsored</span>
        <iframe class="native-ad-iframe"

          sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"
          srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta name='viewport' content='width=device-width,initial-scale=1.0'&gt;&lt;style&gt;body{margin:0;padding:0;overflow:hidden;background:transparent;}#container-c4e03b5b676eb8461b0bde8f49fa1583{width:100%;}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div id='container-c4e03b5b676eb8461b0bde8f49fa1583'&gt;&lt;/div&gt;&lt;script async='async' data-cfasync='false' src='https://pl28846167.effectivegatecpm.com/c4e03b5b676eb8461b0bde8f49fa1583/invoke.js'&gt;&lt;/script&gt;&lt;script&gt;const observer=new ResizeObserver(()=&gt;{window.parent.postMessage({type:'resize-ad',height:document.body.scrollHeight},'*');});observer.observe(document.body);setInterval(()=&gt;window.parent.postMessage({type:'resize-ad',height:document.body.scrollHeight},'*'), 1000);&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
      </div>
    </main>
  </div>

  <footer style="text-align: center; padding: 2rem 0; color: var(--text-muted); font-size: 0.9rem;">
    <p>&copy; 2026 Aidube. All rights reserved. | <a href="privacy_policy.html"
        style="color: var(--primary); text-decoration: none;">Privacy Policy</a></p>
  </footer>

  <script type="module" src="js/index.js?v=3"></script>
  <script>
    window.addEventListener('message', function (e) {
      if (e.data && e.data.type === 'resize-ad') {
        document.querySelectorAll('.native-ad-iframe').forEach(iframe => {
          if (iframe.contentWindow === e.source) iframe.style.height = e.data.height + 'px';
        });
      }
    });
  </script>
</body>

</html>
